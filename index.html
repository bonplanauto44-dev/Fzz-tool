<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fourmizzz S5 — Stats & Classements</title>
  <meta name="description" content="Statistiques en temps réel du serveur S5 de Fourmizzz : classements, carte, progression des joueurs.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    🐜 Fourmizzz <span class="server-badge">S5</span>
  </div>
  <nav>
    <a href="index.html" class="active">Accueil</a>
    <a href="classement.html">Classement</a>
    <a href="carte.html">Carte</a>
    <a href="alliances.html">Alliances</a>
  </nav>
  <div class="update-time" id="update-time">Chargement…</div>
</header>

<main>
  <div id="content" class="loading">Chargement des données…</div>
</main>

<footer>
  Données issues de l'API publique <a href="https://s5.fourmizzz.fr/api/exports/" target="_blank">s5.fourmizzz.fr</a> — mises à jour chaque nuit à minuit.
</footer>

<script>
const OCTO_PSEUDO = 'Octo';

async function loadData() {
  const [players, stats, history] = await Promise.all([
    fetch('data/players.json').then(r => r.json()),
    fetch('data/stats.json').then(r => r.json()),
    fetch('data/history.json').then(r => r.json()).catch(() => []),
  ]);
  return { players, stats, history };
}

function fmt(n) {
  return n == null ? '—' : n.toLocaleString('fr-FR');
}

function deltaHtml(d) {
  if (d == null) return '';
  if (d > 0) return `<span class="delta pos">+${fmt(d)}</span>`;
  if (d < 0) return `<span class="delta neg">${fmt(d)}</span>`;
  return `<span class="delta zero">–</span>`;
}

function rankBadge(r) {
  if (r === 1) return `<span class="rank rank-1">#1</span>`;
  if (r === 2) return `<span class="rank rank-2">#2</span>`;
  if (r === 3) return `<span class="rank rank-3">#3</span>`;
  return `<span class="rank">#${r}</span>`;
}

function playerRow(p, rankField) {
  const isOcto = p.pseudo === OCTO_PSEUDO;
  const alliance = p.alliance
    ? `<span class="alliance-tag">${p.alliance}</span>`
    : `<span style="color:var(--muted);font-size:.85rem">—</span>`;
  const holiday = p.onHoliday ? `<span class="badge-holiday">🏖</span>` : '';
  return `
    <tr class="${isOcto ? 'octo' : ''}">
      <td>${rankBadge(rankField)}</td>
      <td>
        <a href="joueur.html?p=${encodeURIComponent(p.pseudo)}"
           class="pseudo-link ${isOcto ? 'pseudo-octo' : ''}">${p.pseudo}</a>
        ${holiday}
      </td>
      <td>${alliance}</td>
      <td>${fmt(p.field)} cm² ${deltaHtml(p.deltaField)}</td>
      <td>${fmt(p.buildingScore)} ${deltaHtml(p.deltaBuild)}</td>
    </tr>`;
}

function renderOctoHero(players) {
  const octo = players.find(p => p.pseudo === OCTO_PSEUDO);
  if (!octo) return '';
  const delta = octo.deltaRankField != null
    ? (octo.deltaRankField > 0
        ? `<span class="delta pos">▲${octo.deltaRankField}</span>`
        : octo.deltaRankField < 0
        ? `<span class="delta neg">▼${Math.abs(octo.deltaRankField)}</span>`
        : `<span class="delta zero">–</span>`)
    : '';
  return `
    <div class="octo-hero">
      <div class="avatar">🐜</div>
      <div class="info">
        <h3>Octo</h3>
        <div class="sub">Ton compte · Serveur S5</div>
      </div>
      <div class="octo-ranks">
        <div class="octo-rank-item">
          <span class="rv">#${octo.rankField}</span>
          <span class="rl">Terrain ${delta}</span>
        </div>
        <div class="octo-rank-item">
          <span class="rv">#${octo.rankBuild}</span>
          <span class="rl">Bâtiments</span>
        </div>
        <div class="octo-rank-item">
          <span class="rv">${fmt(octo.field)}</span>
          <span class="rl">cm²</span>
        </div>
      </div>
      <a href="joueur.html?p=Octo" class="btn" style="margin-left:auto">Voir profil →</a>
    </div>`;
}

function renderStats(stats) {
  return `
    <div class="stat-grid">
      <div class="stat-tile">
        <span class="val">${fmt(stats.players)}</span>
        <div class="lbl">Joueurs inscrits</div>
      </div>
      <div class="stat-tile">
        <span class="val">${fmt(stats.active)}</span>
        <div class="lbl">Joueurs actifs</div>
      </div>
      <div class="stat-tile">
        <span class="val">${fmt(stats.alliances)}</span>
        <div class="lbl">Alliances</div>
      </div>
      <div class="stat-tile">
        <span class="val">${fmt(stats.withAlliance)}</span>
        <div class="lbl">En alliance</div>
      </div>
      <div class="stat-tile">
        <span class="val">${fmt(stats.maxField)}</span>
        <div class="lbl">Meilleur terrain (cm²)</div>
      </div>
      <div class="stat-tile">
        <span class="val">${fmt(stats.maxBuild)}</span>
        <div class="lbl">Meilleur score bâtiment</div>
      </div>
    </div>`;
}

function topTable(players, sortKey, label, rankKey) {
  const sorted = [...players].sort((a, b) => a[rankKey] - b[rankKey]).slice(0, 10);
  const rows = sorted.map(p => playerRow(p, p[rankKey])).join('');
  return `
    <div class="card">
      <h2>Top 10 — ${label}</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Joueur</th><th>Alliance</th>
            <th>${label}</th><th>Bâtiments</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

async function init() {
  const content = document.getElementById('content');
  try {
    const { players, stats, history } = await loadData();

    document.getElementById('update-time').textContent = `MAJ : ${stats.date}`;

    const tops = players.filter(p => p.deltaField != null && p.deltaField > 0)
      .sort((a, b) => b.deltaField - a.deltaField).slice(0, 5);

    const progressRows = tops.map(p => `
      <tr class="${p.pseudo === OCTO_PSEUDO ? 'octo' : ''}">
        <td><a href="joueur.html?p=${encodeURIComponent(p.pseudo)}" class="pseudo-link ${p.pseudo === OCTO_PSEUDO ? 'pseudo-octo' : ''}">${p.pseudo}</a></td>
        <td>${p.alliance ? `<span class="alliance-tag">${p.alliance}</span>` : '—'}</td>
        <td>${deltaHtml(p.deltaField)} cm²</td>
        <td>#${p.rankField}</td>
      </tr>`).join('');

    content.innerHTML = `
      ${renderOctoHero(players)}
      ${renderStats(stats)}
      <div class="top-grid">
        ${topTable(players, 'field', 'Terrain de chasse', 'rankField')}
        ${topTable(players, 'buildingScore', 'Bâtiments', 'rankBuild')}
      </div>
      ${tops.length > 0 ? `
      <div class="card" style="margin-bottom:2rem">
        <h2>Plus grande progression du jour (terrain)</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>Joueur</th><th>Alliance</th><th>Gain</th><th>Rang terrain</th></tr></thead>
          <tbody>${progressRows}</tbody>
        </table></div>
      </div>` : ''}
    `;
  } catch (e) {
    content.innerHTML = `
      <div class="error-msg">
        Impossible de charger les données : ${e.message}<br>
        <small>Les données sont générées chaque nuit — réessaie demain si le site vient d'être mis en ligne.</small>
      </div>`;
  }
}

init();
</script>
</body>
</html>
