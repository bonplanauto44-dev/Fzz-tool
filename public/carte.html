<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte — Fourmizzz S5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #map-container { height: calc(100vh - 200px); min-height: 450px; }
    .legend {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      margin-bottom: 1rem; align-items: center;
      font-size: .85rem; color: var(--muted);
    }
    .legend-item { display: flex; align-items: center; gap: .4rem; }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🐜 Fourmizzz <span class="server-badge">S5</span></div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="classement.html">Classement</a>
    <a href="carte.html" class="active">Carte</a>
    <a href="alliances.html">Alliances</a>
  </nav>
  <div class="update-time" id="update-time"></div>
</header>

<main>
  <div class="page-title">Carte du serveur S5</div>
  <p class="page-sub">Positions de toutes les fourmilières. <b style="color:var(--orange)">Orange</b> = Octo. Couleur = densité de bâtiments.</p>

  <div class="map-controls">
    <button class="btn" id="btn-reset">Recentrer</button>
    <label>
      <input type="checkbox" id="show-names" style="margin-right:.3rem"> Afficher les pseudos
    </label>
    <label>
      <input type="checkbox" id="show-only-alliance" style="margin-right:.3rem"> Alliance seulement
    </label>
    <span style="color:var(--muted);font-size:.85rem" id="map-count"></span>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3ddc84"></div>Score élevé</div>
    <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>Score moyen</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4b5563"></div>Score faible / 0</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Octo</div>
  </div>

  <div id="map-container">
    <svg id="map-svg"></svg>
    <div class="map-tooltip" id="tooltip"></div>
  </div>
</main>

<footer>
  Données issues de l'API publique <a href="https://s5.fourmizzz.fr/api/exports/" target="_blank">s5.fourmizzz.fr</a>
</footer>

<script>
const OCTO_PSEUDO = 'Octo';

let players = [];
let transform = { x: 0, y: 0, scale: 1 };
let dragging = false;
let dragStart = { x: 0, y: 0 };

function playerColor(p) {
  if (p.pseudo === OCTO_PSEUDO) return '#f97316';
  if (p.buildingScore >= 5) return '#3ddc84';
  if (p.buildingScore >= 3) return '#86efac';
  if (p.buildingScore >= 1) return '#60a5fa';
  return '#4b5563';
}

function buildMap(allPlayers) {
  const showNames   = document.getElementById('show-names').checked;
  const onlyAlliance = document.getElementById('show-only-alliance').checked;

  const displayed = onlyAlliance ? allPlayers.filter(p => p.alliance) : allPlayers;
  document.getElementById('map-count').textContent = `${displayed.length} fourmilières affichées`;

  const xs = displayed.map(p => p.x);
  const ys = displayed.map(p => p.y);
  if (xs.length === 0) return;

  const minX = Math.min(...xs) - 1;
  const maxX = Math.max(...xs) + 1;
  const minY = Math.min(...ys) - 1;
  const maxY = Math.max(...ys) + 1;

  const container = document.getElementById('map-container');
  const W = container.clientWidth;
  const H = container.clientHeight;

  const rangeX = maxX - minX || 1;
  const rangeY = maxY - minY || 1;
  const scaleX = W / rangeX;
  const scaleY = H / rangeY;
  const baseScale = Math.min(scaleX, scaleY) * 0.9;

  function toSvg(px, py) {
    return {
      x: ((px - minX) / rangeX) * W * 0.9 + W * 0.05,
      y: ((py - minY) / rangeY) * H * 0.9 + H * 0.05,
    };
  }

  const svg = document.getElementById('map-svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Grille de fond légère
  let gridLines = '';
  for (let gx = Math.ceil(minX); gx <= Math.floor(maxX); gx += 5) {
    const sx = toSvg(gx, minY).x;
    gridLines += `<line x1="${sx}" y1="0" x2="${sx}" y2="${H}" stroke="#2e3350" stroke-width=".5"/>`;
  }
  for (let gy = Math.ceil(minY); gy <= Math.floor(maxY); gy += 5) {
    const sy = toSvg(minX, gy).y;
    gridLines += `<line x1="0" y1="${sy}" x2="${W}" y2="${sy}" stroke="#2e3350" stroke-width=".5"/>`;
  }

  // Points
  let dots = '';
  let labels = '';
  displayed.forEach(p => {
    const { x, y } = toSvg(p.x, p.y);
    const r = p.pseudo === OCTO_PSEUDO ? 6 : 4;
    const color = playerColor(p);
    dots += `<circle class="map-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"
      fill="${color}" stroke="${p.pseudo === OCTO_PSEUDO ? '#7c2d12' : 'none'}"
      stroke-width="${p.pseudo === OCTO_PSEUDO ? 2 : 0}"
      data-pseudo="${p.pseudo}" data-x="${p.x}" data-y="${p.y}"
      data-field="${p.field}" data-build="${p.buildingScore}"
      data-alliance="${p.alliance || ''}"
      data-rank="${p.rankField}"
      style="cursor:pointer"/>`;
    if (showNames) {
      labels += `<text x="${(x+6).toFixed(1)}" y="${(y+4).toFixed(1)}"
        font-size="9" fill="${p.pseudo === OCTO_PSEUDO ? '#f97316' : '#8891b0'}"
        pointer-events="none">${p.pseudo}</text>`;
    }
  });

  // Cercle de localisation Octo
  const octo = displayed.find(p => p.pseudo === OCTO_PSEUDO);
  let octoRing = '';
  if (octo) {
    const { x, y } = toSvg(octo.x, octo.y);
    octoRing = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14"
      fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3" opacity=".6"/>`;
  }

  svg.innerHTML = `<g id="map-g">${gridLines}${dots}${labels}${octoRing}</g>`;

  applyTransform();
  bindDotEvents();
}

function applyTransform() {
  const g = document.getElementById('map-g');
  if (g) g.setAttribute('transform',
    `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}

function bindDotEvents() {
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.map-dot').forEach(dot => {
    dot.addEventListener('mouseenter', e => {
      const p = e.target.dataset;
      tooltip.innerHTML = `
        <strong style="color:${p.pseudo === OCTO_PSEUDO ? 'var(--orange)' : 'var(--text)'}">${p.pseudo}</strong><br>
        ${p.alliance ? `Alliance : <span class="alliance-tag">${p.alliance}</span><br>` : ''}
        Terrain : ${Number(p.field).toLocaleString('fr-FR')} cm²<br>
        Bâtiments : ${p.build}<br>
        Rang : #${p.rank}<br>
        Position : (${p.x}, ${p.y})`;
      tooltip.style.display = 'block';
    });
    dot.addEventListener('mousemove', e => {
      const rect = document.getElementById('map-container').getBoundingClientRect();
      let tx = e.clientX - rect.left + 14;
      let ty = e.clientY - rect.top - 10;
      if (tx + 220 > rect.width) tx = e.clientX - rect.left - 230;
      tooltip.style.left = tx + 'px';
      tooltip.style.top  = ty + 'px';
    });
    dot.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    dot.addEventListener('click', e => {
      window.location.href = `joueur.html?p=${encodeURIComponent(e.target.dataset.pseudo)}`;
    });
  });
}

// Zoom molette
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('map-container');

  container.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    transform.scale = Math.min(10, Math.max(0.3, transform.scale * factor));
    applyTransform();
  }, { passive: false });

  container.addEventListener('mousedown', e => {
    dragging = true;
    dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    transform.x = e.clientX - dragStart.x;
    transform.y = e.clientY - dragStart.y;
    applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; });

  document.getElementById('btn-reset').addEventListener('click', () => {
    transform = { x: 0, y: 0, scale: 1 };
    applyTransform();
  });

  document.getElementById('show-names').addEventListener('change', () => buildMap(players));
  document.getElementById('show-only-alliance').addEventListener('change', () => buildMap(players));
});

async function init() {
  try {
    const [p, stats] = await Promise.all([
      fetch('data/players.json').then(r => r.json()),
      fetch('data/stats.json').then(r => r.json()),
    ]);
    players = p;
    document.getElementById('update-time').textContent = `MAJ : ${stats.date}`;
    buildMap(players);
  } catch (e) {
    document.getElementById('map-container').innerHTML = `<div class="error-msg" style="margin:2rem">Erreur : ${e.message}</div>`;
  }
}

init();
</script>
</body>
</html>
